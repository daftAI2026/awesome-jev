# [INPUT]: 依赖 TanStack Start 构建入口与 Cloudflare Workers Static Assets
# [OUTPUT]: 提供 Worker 兼容配置、ASSETS 绑定与免费日志
# [POS]: 根级部署边界；目录查询由轻入口读取静态页，长尾与预览保留 SSR
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# Cloudflare Workers — TanStack Start 预渲染与路由回退
# GitHub main verify → 同版本 dist 产物 → production job 直接部署；切换步骤见 docs/deployment.md

name = "awesome-jev-project"
main = "src/server.ts"
compatibility_date = "2026-09-24"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
html_handling = "drop-trailing-slash"
# --- 轻入口按查询读取有限产物；避免第一页 HTML 覆盖 ?page=2 ---
run_worker_first = ["/", "/zh", "/ja", "/top100", "/zh/top100", "/ja/top100", "/news", "/zh/news", "/ja/news", "/category/*", "/zh/category/*", "/ja/category/*", "/tags", "/zh/tags", "/ja/tags", "/tags/*", "/zh/tags/*", "/ja/tags/*"]

[secrets]
required = []

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
invocation_logs = true
