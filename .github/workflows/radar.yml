# [INPUT]: 依赖 GitHub 发现/取证、原 Jev 预算与共享数据发布器
# [OUTPUT]: 发现并审核核心候选，验证并发布目录与独占检查点
# [POS]: 核心审核预算域；不依赖统计探针，身份校验由采集器执行
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Jev ecosystem radar
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Jev {0}: {1}', inputs.mode, github.ref_name) || github.event.pull_request.title || github.event.head_commit.message || github.event_name }}
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Scan GitHub and review candidates with Jev (paid API)
        type: choice
        options: [sync]
        default: sync
      publish:
        description: Commit the validated snapshot to main (sync only)
        type: boolean
        default: false
      limit:
        description: Maximum Jev reviews in this run
        type: choice
        options: ['5', '60', '2000']
        default: '2000'
permissions:
  contents: read
concurrency:
  group: jev-radar-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  scan:
    permissions:
      contents: read
      actions: read
    if: >-
      github.repository == 'daftAI2026/awesome-jev' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && vars.RADAR_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.snapshot.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Find trusted radar budget
        id: budget-checkpoint
        run: node --experimental-strip-types scripts/review-checkpoint.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JEV_CHECKPOINT_KIND: radar
      - name: Restore radar budget
        id: budget-restore
        if: steps.budget-checkpoint.outputs.artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.budget-checkpoint.outputs.artifact_id }}
          run-id: ${{ steps.budget-checkpoint.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/jev-radar-budget
          merge-multiple: true
      - name: Collect and review (no dependency installation)
        id: collect
        run: node --experimental-strip-types scripts/radar.ts "$RUNNER_TEMP/snapshot"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          RADAR_LIMIT: ${{ inputs.limit || '2000' }}
          JEV_RADAR_BUDGET_DIR: ${{ runner.temp }}/jev-radar-budget
      - name: Save radar request budget
        if: always() && steps.budget-checkpoint.outcome == 'success' && steps.budget-restore.outcome != 'failure' && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jev-radar-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jev-radar-budget/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Save failed collection diagnostics (not a publishable snapshot)
        if: failure() && steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radar-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot/radar
          if-no-files-found: warn
          retention-days: 14
      - id: snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radar-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot
          if-no-files-found: error
          retention-days: 14
  validate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.scan.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact_id }}
          path: ${{ runner.temp }}/snapshot
          merge-multiple: true
      - run: node --experimental-strip-types scripts/radar.ts --apply "$RUNNER_TEMP/snapshot"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run categories:check && npm run data:check && npm run lint && npm run build && npm run test:delivery
  publish:
    concurrency:
      group: jev-data-publish
      cancel-in-progress: false
      queue: max
    needs: [scan, validate]
    if: github.event_name == 'schedule' || inputs.publish == true
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.scan.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact_id }}
          path: ${{ runner.temp }}/snapshot
          merge-multiple: true
      - run: node --experimental-strip-types scripts/radar.ts --apply "$RUNNER_TEMP/snapshot"
      - name: Publish on latest main with bounded conflict recovery
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/publish-data.ts radar
      - name: Request verified main deployment after data publication
        if: steps.publication.outputs.status == 'published' && steps.publication.outputs.site_changed == 'true' && vars.CLOUDFLARE_ACTIONS_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=validate
