# [INPUT]: 依赖 AIHOT 同步、新闻验证、构建和共享最新 main 发布脚本
# [OUTPUT]: 发布新闻快照与站点地图；实际发布后派发可信 main 构建和部署
# [POS]: workflows 的新闻链路；不修改 GitHub 项目数据
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Jev news sync
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jev-news-sync
  cancel-in-progress: false
jobs:
  sync:
    # 维护者用仓库变量控制这条独立的新闻采集链路。
    if: >-
      github.repository == 'daftAI2026/awesome-jev' && github.ref == 'refs/heads/main' &&
      vars.AIHOT_NEWS_ENABLED == 'true'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Pull recent Jev news into the incremental store
        run: npm run news:sync
        env:
          AIHOT_NEWS_ENABLED: 'true'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run news:check && npm run build && npm run test:delivery
      - name: Publish news and sitemap on latest main
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/publish-data.ts news
      - name: Request verified main deployment after data publication
        if: steps.publication.outputs.status == 'published' && vars.CLOUDFLARE_ACTIONS_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=validate
