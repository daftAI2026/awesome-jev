# [INPUT]: 依赖投稿者提供的公开 GitHub 仓库与来源证据
# [OUTPUT]: 生成 [Submission] Issue，交由既有收录机器人和维护者审核
# [POS]: ISSUE_TEMPLATE 的项目投稿表单；不要求编辑目录，不自动发布
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Submit a project / 提交项目
description: Suggest a Jev / System One project without editing JSON. 无需修改代码即可推荐项目。
title: "[Submission] "
body:
  - type: markdown
    attributes:
      value: |
        Recommend one public GitHub repository per issue. A GitHub account is required.
        每个申请请推荐一个公开 GitHub 仓库，需要登录 GitHub。
        The review bot checks relevance. A separate intake bot can merge a catalog PR after a verified recommendation or maintainer approval and successful validation.
        审核机器人检查关联性；独立收录机器人在有效审核建议或维护者批准及校验通过后，才会合并目录 PR。
        Do not include API keys, credentials or private material. 请勿填写密钥、凭据或私有资料。
  - type: input
    id: repository
    attributes:
      label: GitHub repository / 仓库地址
      description: Canonical repository URL, not a profile, article or demo site. 请填写仓库首页地址。
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Project description / 项目简介
      description: Briefly explain what the project does. 简要说明项目用途。
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Jev / System One connection / 关联证据
      description: |
        Explain the connection and link to README, documentation or code in this same repository.
        For independent typed-decision alternatives, explain the implementation and link to its license.
        请说明与 Jev / System One 的具体关联，并附同一仓库的 README、文档或代码链接。
        独立类型化决策替代实现请说明实现方式，并附许可证链接。不要附其他待推荐仓库的链接。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I checked the directory and open submissions for duplicates. 已检查目录与未处理申请，避免重复投稿。
          required: true
        - label: This is a public, non-fork, non-archived repository with verifiable evidence. 仓库公开、非 fork、未归档，关联证据可核验。
          required: true
        - label: I understand submission is not approval, and listing does not certify security or Jev compatibility. 我理解提交不等于批准，收录不代表安全性或 Jev 兼容性认证。
          required: true
