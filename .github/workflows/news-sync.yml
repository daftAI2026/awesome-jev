name: Jev news sync
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jev-news-sync
  cancel-in-progress: false
jobs:
  sync:
    # 维护者用仓库变量控制这条独立的新闻采集链路。
    if: >-
      github.repository == 'daftAI2026/awesome-jev' && github.ref == 'refs/heads/main' &&
      vars.AIHOT_NEWS_ENABLED == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Pull recent Jev news into the incremental store
        run: npm run news:sync
        env:
          AIHOT_NEWS_ENABLED: 'true'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run news:check && npm run build
      - name: Publish news and sitemap together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/news.json public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'data: sync Jev news'
            # 主分支已变化时留给下一轮恢复；不强推、不覆盖其他采集结果。
            git -c credential.helper='!gh auth git-credential' push origin HEAD:main
          fi
