# [INPUT]: 依赖替代实现采集与可信快照校验与共享最新 main 发布脚本
# [OUTPUT]: 执行独立开源替代实现的发现、验证与发布
# [POS]: workflows 的替代实现链路；独立开关、预算和状态
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Open-source alternatives radar
on:
  schedule:
    - cron: '41 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Validate offline, or scan GitHub with Jev
        type: choice
        options: [validate, sync]
        default: validate
      publish:
        description: Commit the validated snapshot to main (sync only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: jev-alternatives-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run categories:check && npm run data:check && npm run lint && npm run build && npm run test:delivery
  scan:
    permissions:
      contents: read
      actions: read
    if: >-
      github.repository == 'daftAI2026/awesome-jev' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && vars.ALTERNATIVES_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.snapshot.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Find trusted alternatives budget
        id: budget-checkpoint
        run: node --experimental-strip-types scripts/review-checkpoint.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JEV_CHECKPOINT_KIND: alternatives
      - name: Restore alternatives budget
        id: budget-restore
        if: steps.budget-checkpoint.outputs.artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.budget-checkpoint.outputs.artifact_id }}
          run-id: ${{ steps.budget-checkpoint.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/jev-alternatives-budget
          merge-multiple: true
      - name: Collect and review (no dependency installation)
        id: collect
        run: node --experimental-strip-types scripts/alternatives-radar.ts "$RUNNER_TEMP/snapshot"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_ALTERNATIVES_BUDGET_DIR: ${{ runner.temp }}/jev-alternatives-budget
      - name: Save alternatives request budget
        if: always() && steps.budget-checkpoint.outcome == 'success' && steps.budget-restore.outcome != 'failure' && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jev-alternatives-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jev-alternatives-budget/*.json
          if-no-files-found: error
          retention-days: 7
      - id: snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alternatives-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot
          if-no-files-found: error
          retention-days: 14
  validate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.scan.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact_id }}
          path: ${{ runner.temp }}/snapshot
          merge-multiple: true
      - run: node --experimental-strip-types scripts/alternatives-radar.ts --apply "$RUNNER_TEMP/snapshot"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run categories:check && npm run data:check && npm run lint && npm run build && npm run test:delivery
  publish:
    needs: [scan, validate]
    if: github.event_name == 'schedule' || inputs.publish == true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.scan.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact_id }}
          path: ${{ runner.temp }}/snapshot
          merge-multiple: true
      - run: node --experimental-strip-types scripts/alternatives-radar.ts --apply "$RUNNER_TEMP/snapshot"
      - name: Publish on latest main with bounded conflict recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/publish-data.ts alternatives
