name: Jev video candidate review
on:
  workflow_dispatch:
    inputs:
      candidates_json:
        description: Verified video metadata JSON array (no secrets)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: jev-video-review
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'daftAI2026/awesome-jev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Review verified video metadata
        run: node --experimental-strip-types scripts/review-videos.ts "$RUNNER_TEMP/video-review.json"
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_VIDEO_CANDIDATES: ${{ inputs.candidates_json }}
      - name: Save review results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/video-review.json
          if-no-files-found: error
          retention-days: 14
